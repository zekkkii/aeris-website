  function switchTab(t) { setTab(t); setErr(''); setF({email:'',pass:''}); setOk(false); }

  return h('div', { className:'overlay', onClick:e=>{ if(e.target.classList.contains('overlay')) close(); } },
    h('div', { className:'modal' },
      h('button', { className:'modal-x', onClick:close }, '✕'),
      h('div', { className:'modal-logo' }, 'Aeris Academy'),
      ok
        ? h('div', { className:'m-done' },
            h('div', { className:'m-check' }, '👋'),
            h('h4', null, '¡Bienvenido!'),
            h('p', null, 'Redirigiendo a la plataforma virtual...'),
            h('a', { href:MOODLE, target:'_blank', className:'btn btn-accent btn-lg', style:{display:'inline-flex'} }, 'Ir a la plataforma →')
          )
        : h(React.Fragment, null,
            h('div', { className:'m-tabs' },
              h('button', { className:'mt'+(tab==='login'?' on':''), onClick:()=>switchTab('login') }, 'Acceder a la plataforma'),
              h('button', { className:'mt'+(tab==='register'?' on':''), onClick:()=>switchTab('register') }, 'Registrarse'),
            ),
            tab==='login'
              ? h(React.Fragment, null,
                  h('h3', null, 'Acceder a la plataforma'),
                  h('p', { className:'msub' }, 'Ingresa tus credenciales para acceder al aula virtual.'),

                      h('label',{htmlFor:'me'},'Correo electrónico'),
                      h('input',{id:'me',type:'email',placeholder:'correo@ejemplo.com',value:f.email,onChange:upd('email')})
                    ),
                    h('div',{className:'mf'},
                      h('label',{htmlFor:'mp'},'Contraseña'),
                      h('input',{id:'mp',type:'password',placeholder:'••••••••',value:f.pass,onChange:upd('pass')})
                    ),
                    err && h('p',{className:'m-err'},err),
                    h('button',{type:'submit',className:'m-submit'},'Entrar al aula virtual')
                  ),
                  h('div',{className:'m-divider'},h('hr'),h('span',null,'o'),h('hr')),
                  h('a',{className:'m-moodle',href:MOODLE,target:'_blank',rel:'noopener'},'🎓  Acceder directamente con Moodle')
                )
              : h(React.Fragment, null,
                  h('h3', null, 'Solicitar inscripción'),
                  h('p', { className:'msub' }, 'El acceso al aula virtual lo crea nuestro equipo de soporte una vez confirmada tu inscripción.'),

                    h('a', { className:'reg-wa', href:WA, target:'_blank', rel:'noopener', style:{color:'#fff'} },
                      h('i',{className:'fa-brands fa-whatsapp',style:{fontSize:'1.15rem'}}),

                    )
                  )

}

/* ── REG MODAL ── */
function RegModal({ close, msg, courseTitle }) {
  const waLink = WA_BASE + '?text=' + encodeURIComponent(msg);
  return h('div', { className:'overlay', onClick:e=>{ if(e.target.classList.contains('overlay')) close(); } },
    h('div', { className:'modal' },
      h('button', { className:'modal-x', onClick:close }, '✕'),
      h('div', { className:'modal-logo' }, 'Aeris Academy'),
      h('h3', null, courseTitle ? 'Información del curso' : 'Solicitar inscripción'),
      courseTitle && h('p', { style:{fontSize:'0.85rem',fontWeight:'700',color:'var(--accent)',marginBottom:'4px',marginTop:'-4px'} }, courseTitle),
      h('p', { className:'msub' }, 'Escríbenos por WhatsApp y nuestro equipo te dará todos los detalles: contenido, horarios, precio y proceso de inscripción.'),
      h('div', { className:'reg-info' },
        h('p', null, '👋 Te responderemos a la brevedad con toda la información que necesitas para tomar la mejor decisión.'),
        h('a', { className:'reg-wa', href:waLink, target:'_blank', rel:'noopener', style:{color:'#fff'} },
          h('i', { className:'fa-brands fa-whatsapp', style:{fontSize:'1.15rem'} }),
          '  Escribir por WhatsApp'
        )
      )
    )
  );
}

/* ── CONTACT FORM ── */
function ContactForm() {
  const [f, setF] = useState({name:'',email:'',msg:''});
  const [sent, setSent] = useState(false);
  const upd = k => e => setF(p=>({...p,[k]:e.target.value}));
  function handleSubmit(e) {
    e.preventDefault();
    setSent(true);
  }
  if (sent) return h('p',{className:'cf-ok'},'✓ Mensaje enviado. Te contactamos pronto.');
  return h('form',{className:'cf',onSubmit:handleSubmit},
    h('div',{className:'cf-row'},
      h('div',{className:'fg'},h('label',null,'Nombre'),h('input',{type:'text',placeholder:'Tu nombre',value:f.name,onChange:upd('name'),required:true})),
      h('div',{className:'fg'},h('label',null,'Correo'),h('input',{type:'email',placeholder:'correo@ejemplo.com',value:f.email,onChange:upd('email'),required:true}))
    ),
    h('div',{className:'fg'},h('label',null,'Mensaje'),h('textarea',{rows:4,placeholder:'¿En qué podemos ayudarte?',value:f.msg,onChange:upd('msg')})),
    h('button',{type:'submit',className:'cf-btn'},'Enviar mensaje')
  );
}
